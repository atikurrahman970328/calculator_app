name: calculator_app
description: A professional-grade Android calculator app built with Flutter and Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Math Calculation Engine
  math_expressions: ^2.4.0

  # Local Storage for History Log
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utility
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation for Hive Models
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true